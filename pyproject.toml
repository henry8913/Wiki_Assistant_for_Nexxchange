[project]
name = "wiki-assistant"
version = "0.1.0"
description = "AI Wiki Assistant for Nexxchange GolfSuite - web chat powered by Agno + OpenRouter + pgvector"
requires-python = ">=3.12"
dependencies = [
    "agno[os,postgres]>=3.2.1,<4",
    "openai>=1.0.0",
    "sqlalchemy>=2.0.0",
    "psycopg>=3.3.0",
    "psycopg-binary>=3.3.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "python-dotenv>=1.0.0",
    "pgvector>=0.3.0",
    "pypdf>=5.0.0",
    "fastembed>=0.9.0",
    "Pillow>=10.0.0",
]

[dependency-groups]
dev = []
