services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai
      POSTGRES_USER: ai
      POSTGRES_PASSWORD: ai
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai -d ai"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - default
      - npm_default

  bot:
    build:
      context: .
      target: bot
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://ai:ai@db:5432/ai
      WEBHOOK_DOMAIN: ${WEBHOOK_DOMAIN}
    ports:
      - "7777:7777"
    entrypoint: ["/app/entrypoint.sh"]
    networks:
      - default
      - npm_default

volumes:
  pgdata:

networks:
  npm_default:
    external: true
