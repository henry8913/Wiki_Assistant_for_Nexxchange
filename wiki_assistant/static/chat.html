<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>Wiki Assistant - Nexxchange</title>
<link rel="canonical" href="https://wiki-assistant.henrydev.it/chat">
<link rel="icon" type="image/avif" sizes="32x32" href="/img/favicon.avif">
<link rel="stylesheet" href="/static/widget.css">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
<!-- Open Graph -->
<meta property="og:type" content="website">
<meta property="og:url" content="https://wiki-assistant.henrydev.it/chat">
<meta property="og:title" content="Wiki Assistant - Nexxchange">
<meta property="og:description" content="Assistente AI per il manuale GolfSuite di Nexxchange. Cerca informazioni, regole e procedure del software gestionale per campi da golf.">
<meta property="og:image" content="https://wiki-assistant.henrydev.it/img/1a.png">
<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Wiki Assistant - Nexxchange">
<meta name="twitter:description" content="Assistente AI per il manuale GolfSuite di Nexxchange. Cerca informazioni, regole e procedure.">
<meta name="twitter:image" content="https://wiki-assistant.henrydev.it/img/1a.png">
</head>
<body class="chat-full">
<div class="header">
  <div class="header-i"><span class="header-t">Wiki Assistant</span><span class="header-s">Nexxchange</span></div>
  <button class="header-btn" id="ws-hdr-btn" aria-label="Sessioni"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></button>
</div>
<div class="chat-wrap">
  <div class="chat-bg"></div>
  <div class="chat-inner">
    <div class="panel" id="ws-panel"><button class="new-btn" id="ws-new-btn">+ Nuova chat</button><div id="ws-sess-list"></div></div>
    <div class="messages" id="ws-body">
      <div class="msg bot">Ciao! Sono Wiki Assistant di GolfSuite. Come posso aiutarti oggi?</div>
    </div>
    <button id="ws-scroll-btn" aria-label="Scorri in basso"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg></button>
    <div class="typing" id="ws-typing"><span class="d"></span><span class="d"></span><span class="d"></span><span class="t">Sto cercando nel manuale...</span></div>
    <div class="error-msg" id="ws-err"></div>
    <div class="input-area">
      <div class="input-wrap">
        <input id="ws-inp-field" type="text" placeholder="Scrivi una domanda..." autocomplete="off">
        <button id="ws-send-btn" aria-label="Invia"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></button>
      </div>
    </div>
  </div>
</div>
<script src="/static/widget.js"></script>
</body>
</html>
